<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Grid</title>
</head>
<body>
    <header>
        <nav>
            <ul class="menu">
                <li>Grid 1</li>
                <li>Grid 2</li>
                <li>Grid 3</li>
            </ul>
        </nav>
    </header>

    <section>
        <ul class="grid-lista">
            <li>
                <article class="grid-cartao">
                    Grid 1
                </article>
            </li>
            <li>
                <article class="grid-cartao">
                    Grid 2
                </article>
            </li>
            <li>
                <article class="grid-cartao">
                    Grid 3
                </article>
            </li>

        </ul>
    </section>

    <section class="grid-amb">
        <header>
            <h2>Grid CSS</h2>
        </header>
        <ul class="grid-img">
            
            <li>
                <figure>
                    <img src="https://images.hdqwalls.com/wallpapers/the-simpsons-tv-series-4k-v6.jpg" alt="Grid CSS - aplicando Grids">
                </figure>
            </li>

            <li>
                <figure>
                    <img src="https://images.hdqwalls.com/wallpapers/the-simpsons-tv-series-4k-v6.jpg" alt="Grid Imagem - aplicando Grids em Imagens">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://images.hdqwalls.com/wallpapers/the-simpsons-tv-series-4k-v6.jpg" alt="Grid Template - Modelos de Templates">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://images.hdqwalls.com/wallpapers/the-simpsons-tv-series-4k-v6.jpg" alt="Grid Rows - Linhas em Grids">
                </figure>
            </li>

        </ul>
    </section>

    <section>
        <ul class="grid-teste">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>7</li>
            <li>8</li>
            <li>9</li>
            <li>10</li>
        </ul>
    </section>



</body>
</html>
