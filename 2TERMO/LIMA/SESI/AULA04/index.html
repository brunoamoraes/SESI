<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icone favorito -->
    <link rel="shortcut icon" href="IMAGENS/home.png" type="image/x-icon">

    <title>FAVICONS e IMAGENS</title>
</head>
<body>
    <h1>Imagens do Google</h1>
    <h2>X-MEN</h2>
    <div>
        <!-- Tag para acrescentar imagens - img -->
        <img src="IMAGENS/Imagem_xmen.png" alt="Serie X-Men 97'" title="Serie X-Men 97'" align="right">
    </div>

    <h2>X-MEN - com proporção de imagens</h2>
    <div>
        <img src="IMAGENS/Imagem_xmen.jpg" 
        alt="Serie X-Men 97'" 
        title="Serie X-Men 97'"
        width="800px"
        height="600px"
        >
    </div>

    <h2>X-MEN - com proporção de imagens com style</h2>
    <div>
        <img src="IMAGENS/Imagem_xmen.png" 
        alt="Serie X-Men 97'" 
        title="Serie X-Men 97'" 
        style=
        "margin: 20px;
        position: absolute;
        background-repeat: repeat-x;"
        >
    </div>

    
</body>
</html>
